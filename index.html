<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agriculture Student Portal</title>
  <meta name="theme-color" content="#070b14" />
  
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <main class="container">
    <section class="stats-strip">
      <div class="stat-pill">
        <span class="stat-num" id="liveCount">—</span>
        <span class="stat-lbl bn">লাইভ</span>
      </div>

      <button class="stat-pill install-btn" id="installBtn" title="Install App" style="cursor: pointer; background: var(--aurora);">
        ⬇️ <span class="bn">অ্যাপ ডাউনলোড</span>
      </button>
    </section>

    </main>

  <script>
    // ১. সার্ভিস ওয়ার্কার রেজিস্ট্রেশন (অফলাইন মোডের জন্য)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
      });
    }

    // ২. ইনস্টল লজিক
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    // ব্রাউজার যখন ইনস্টল করার জন্য রেডি হয়
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // বাটনটিকে উজ্জ্বল করা বা স্টাইল পরিবর্তন করা চাইলে এখানে করতে পারিস
      installBtn.style.opacity = "1"; 
    });

    // বাটনে ক্লিক করলে যা হবে
    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User installed the app');
          }
          deferredPrompt = null;
        });
      } else {
        // যদি ব্রাউজার থেকে সাপোর্ট না পায় বা অলরেডি ইনস্টল থাকে
        alert("আপনার ব্রাউজারে এটি সরাসরি ইনস্টলযোগ্য অথবা অলরেডি ইনস্টল করা আছে।");
      }
    });

    // ইনস্টল হয়ে গেলে বাটনটির লেখা বদলে দেওয়া (অপশনাল)
    window.addEventListener('appinstalled', () => {
      installBtn.innerHTML = "✅ ইনস্টলড";
      deferredPrompt = null;
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
